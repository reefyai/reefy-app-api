name: Build reefy-app-api image

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || (github.head_ref && format('refs/heads/{0}', github.head_ref)) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

jobs:
  build-push:
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","Linux","X64","big-bird"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          pull: true
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          # desired_state.py pins REEFY_APP_API_IMAGE by the sha-<short>
          # tag (same pattern as reefy-proxy / reefy-llm-proxy); :main
          # tracks the branch tip.
          tags: |
            ghcr.io/reefyai/reefy-app-api:${{ steps.sha.outputs.short }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/reefyai/reefy-app-api:main' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - if: github.event_name != 'pull_request'
        run: echo "Pushed ghcr.io/reefyai/reefy-app-api:${{ steps.sha.outputs.short }}"
