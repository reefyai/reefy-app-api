name: Build reefy-app-api image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # GitHub-hosted: the self-hosted runner has had intermittent TLS
    # issues to ghcr.io, and this is a tiny image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Short SHA
        id: sha
        run: echo "short=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          # desired_state.py pins REEFY_APP_API_IMAGE by the sha-<short>
          # tag (same pattern as reefy-proxy / reefy-llm-proxy); :main
          # tracks the branch tip.
          tags: |
            ghcr.io/reefyai/reefy-app-api:${{ steps.sha.outputs.short }}
            ghcr.io/reefyai/reefy-app-api:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - run: echo "Pushed ghcr.io/reefyai/reefy-app-api:${{ steps.sha.outputs.short }}"
